[package]
name = "virtual-load-balancer"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "High-performance multi-provider failover gateway for Linux"
license = "MIT"

[[bin]]
name = "vlb"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
debug = false
incremental = false

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time", "process", "signal", "sync", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi", "chrono"] }
colored = "2.1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
