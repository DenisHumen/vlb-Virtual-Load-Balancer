[package]
name = "virtual-load-balancer"
version = "0.1.0"
edition = "2021"
# MSRV 1.85 — required because our transitive deps (clap_lex 1.1, anstream 1.0,
# serde 1.0.228, etc.) have adopted Cargo `edition2024`. The launcher script
# (`scripts/vlb.sh`) will bootstrap rustup/stable automatically if needed.
rust-version = "1.85"
description = "High-performance multi-provider failover gateway for Linux"
license = "MIT"

[[bin]]
name = "vlb"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
debug = false
incremental = false

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time", "process", "signal", "sync", "fs", "io-util", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi", "chrono"] }
colored = "2.1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
ratatui = "0.28"
crossterm = "0.28"
sysinfo = { version = "0.31", default-features = false, features = ["system", "disk", "network"] }
