[package]
name = "vlb"
version = "0.0.1-alpha"
edition = "2024"
# Pinned to stable 1.88+ because several transitive crates (darling 0.23,
# instability 0.3.12 pulled by ratatui) require it.
rust-version = "1.88"
description = "Multi-uplink failover gateway for Linux: per-provider health probes (ICMP+DNS, fwmark-bound), automatic default-route switching, conntrack flushing, SQLite stats, TUI."
license = "MIT"
repository = "https://github.com/DenisHumen/vlb-Virtual-Load-Balancer"
readme = "README.md"
keywords = ["networking", "failover", "gateway", "linux", "policy-routing"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "vlb"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
debug = false
incremental = false

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time", "process", "signal", "sync", "fs", "io-util", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi", "chrono"] }
colored = "2.1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
ratatui = "0.28"
crossterm = "0.28"
sysinfo = { version = "0.31", default-features = false, features = ["system", "disk", "network"] }
libc = "0.2"
