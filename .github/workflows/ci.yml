name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      # A shipped example that does not validate is a broken first-run
      # experience, and it is the file every operator copies. Catch it here
      # rather than in someone's terminal.
      - name: Validate the shipped example config
        run: ./target/release/vlb --config examples/vlb.example.toml check

      # The default canary config points at canary/canary.txt in this repo and
      # looks for a marker inside it. A unit test pins the two together, but
      # this also guards the file itself surviving a merge.
      - name: Canary file sanity
        run: |
          head -1 canary/canary.txt | grep -qx 'vlb-canary-v1-do-not-edit' \
            || { echo "canary/canary.txt lost its marker line"; exit 1; }

  failover-lab:
    name: Failover lab (docker)
    runs-on: ubuntu-latest
    # Ubuntu 24.04 containers matching the deployment target: two simulated
    # ISPs broken in eight ways, plus the operational cases that actually
    # take gateways down — competing netplan/networkd routes, a missing
    # conntrack, operator commands racing a switchover, a restart, and a soak
    # over repeated failover cycles. Assertions run from a LAN client behind
    # the gateway, so they measure what users experience.
    #
    # Slower than the unit suite, so it runs in parallel with it. The timeout
    # is generous because the soak and throttle scenarios are wall-clock
    # bound by design, not by CPU.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Invoked through `bash` rather than executed directly: a checkout on a
      # filesystem that does not carry the exec bit would otherwise fail with
      # a bare "exit code 126" and no hint as to why.
      #
      # On a failure the harness prints the daemon's log itself before it
      # tears the lab down; a separate step afterwards would find no
      # containers left to ask.
      - name: Run the failover scenarios
        run: bash ./docker/test/run-tests.sh
