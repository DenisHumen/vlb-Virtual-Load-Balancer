[general]
lan_interface = "enp0s18"
gateway_address = "10.0.0.100"

[health]
interval_secs = 3
timeout_ms = 1000
failure_threshold = 2
success_threshold = 2
probe_targets = ["1.1.1.1", "8.8.8.8"]
status_print_secs = 30

[routing]
table_base  = 200
fwmark_base = 0x200
rule_pref   = 32000

[firewall]
manage = true
disable_host_firewall = false

[database]
path = "/var/lib/vlb/stats.db"

[control]
listen = "127.0.0.1:7650"

[traffic]
enabled = true
interval_secs = 2
retention_hours = 72

[system]
enabled = true
interval_secs = 2
retention_hours = 72
per_core = true

[[providers]]
name = "isp-main"
gateway = "10.0.0.2"
interface = "enp0s18"
priority = 0
role = "primary"

[[providers]]
name = "isp-backup-a"
gateway = "10.0.0.1"
interface = "enp0s18"
priority = 1
role = "backup"

[[providers]]
name = "isp-backup-b"
gateway = "10.0.1.1"
interface = "enp0s18"
priority = 2
role = "backup"